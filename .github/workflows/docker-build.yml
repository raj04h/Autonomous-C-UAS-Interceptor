# "A CI pipeline automatically builds and validates my Docker images."

name: Counter-UAS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  docker-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build ROS2 Image

      - name: Build ROS2 Image

        run: |
          docker build \
          -f docker/Dockerfile.ros2 \
          -t counter-uas-ros:latest .

      # Build Backend Image

      - name: Build Backend Image

        run: |
          docker build \
          -f docker/Dockerfile.backend \
          -t counter-uas-backend:latest .

      # Build Frontend Image

      - name: Build Frontend Image

        run: |
          docker build \
          -f docker/Dockerfile.frontend \
          -t counter-uas-frontend:latest .